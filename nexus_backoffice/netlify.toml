[build]
  command = "npm run build"
  # El runtime Next (@netlify/plugin-nextjs) mueve estáticos a
  # `.netlify/static` en onPostBuild; publish debe apuntar a `.next`.
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  # Evita OOM en builds locales Windows al empaquetar páginas.
  NODE_OPTIONS = "--max-old-space-size=4096"

# Cabeceras de seguridad básicas para el sitio público y el backoffice.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
